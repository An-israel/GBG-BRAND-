name: Weekly report and uptime check

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    if: vars.SHOPIFY_STORE_DOMAIN != ''
    runs-on: ubuntu-latest
    env:
      SHOPIFY_STORE_DOMAIN: ${{ vars.SHOPIFY_STORE_DOMAIN }}
      SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
      SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run report:weekly
      - run: npm run smoke
        if: vars.SMOKE_BASE_URL != ''
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: weekly-report, path: "reports/\nlogs/" }
